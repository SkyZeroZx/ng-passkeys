# Optional. The demo runs without this; bring it up only to exercise the
# Redis and Postgres drivers.
#
#   docker compose up -d
#   REDIS_URL=redis://localhost:6379 \
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/ngpasskeys npm start

services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    # GETDEL needs 6.2+; 7 is well clear of that.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ngpasskeys
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 5
